name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native Kraken library
        shell: bash
        run: python tools/build_ooz_native.py --output-dir artifacts/native

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StalkerSaveEditor.sln

      - name: Build
        run: dotnet build StalkerSaveEditor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test StalkerSaveEditor.sln --configuration Release --no-build --no-restore

      - name: Test benchmark regression checker
        run: python -m unittest discover -s tests/tools -p 'test_*.py'

      - name: Check CLI version command
        run: dotnet src/StalkerSaveEditor.Cli/bin/Release/net10.0/StalkerSaveEditor.Cli.dll version

      - name: Publish the CLI with NativeAOT (as the release packages do)
        if: runner.os == 'Linux'
        run: dotnet publish src/StalkerSaveEditor.Cli/StalkerSaveEditor.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/aot-cli

      - name: Render read-only UI screenshot
        run: dotnet src/StalkerSaveEditor.App/bin/Release/net10.0/StalkerSaveEditor.dll --screenshot artifacts/ui/${{ runner.os }}.png --fixture tests/Fixtures/xray-call-of-pripyat.sav

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-${{ runner.os }}
          path: artifacts/ui/*.png
          if-no-files-found: warn

      - name: Run short performance benchmarks
        if: runner.os == 'Linux'
        run: |
          for run in 1 2 3; do
            dotnet run --project benchmarks/StalkerSaveEditor.Benchmarks.csproj --configuration Release --no-build -- --filter '*' --job Short --exporters csv --artifacts "artifacts/benchmarks/run-${run}"
          done

      - name: Check performance regression threshold
        if: runner.os == 'Linux'
        run: python tools/check_benchmark_regressions.py --baseline benchmarks/baseline.json --reports artifacts/benchmarks

      - name: Upload performance report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: artifacts/benchmarks
          if-no-files-found: warn
