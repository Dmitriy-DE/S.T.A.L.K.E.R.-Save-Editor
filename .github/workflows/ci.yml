name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Check out Python codec oracle
        uses: actions/checkout@v4
        with:
          repository: Dmitriy-DE/S.T.A.L.K.E.R.-Save_Editor
          ref: 6f3839cb870161290ae1d404c40e291485c29e37
          path: python-oracle

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native Kraken library
        shell: bash
        run: python tools/build_ooz_native.py --python-repo python-oracle --output-dir artifacts/native

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore StalkerSaveEditor.sln

      - name: Build
        run: dotnet build StalkerSaveEditor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test StalkerSaveEditor.sln --configuration Release --no-build --no-restore

      - name: Check CLI version command
        run: dotnet src/StalkerSaveEditor.Cli/bin/Release/net10.0/StalkerSaveEditor.Cli.dll version

      - name: Render read-only UI screenshot
        run: dotnet src/StalkerSaveEditor.Desktop/bin/Release/net10.0/StalkerSaveEditor.Desktop.dll --screenshot artifacts/ui/${{ runner.os }}.png --fixture tests/Fixtures/xray-call-of-pripyat.sav

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-${{ runner.os }}
          path: artifacts/ui/*.png
          if-no-files-found: warn
