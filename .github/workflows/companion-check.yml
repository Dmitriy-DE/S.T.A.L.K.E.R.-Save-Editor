name: Companion Mod Check

on:
  # Branch pushes are checked through their pull request; a second identical run per push only doubled the queue.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-check:
    name: Companion Lua and Protocol Syntax Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Lua 5.1 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Verify luac5.1 availability
        run: |
          LUA_BIN="$(command -v luac5.1 || command -v luac)"
          "$LUA_BIN" -v

      - name: Run companion mod checks
        run: ./tools/check_companion.sh
