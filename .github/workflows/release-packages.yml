name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      dry_run:
        description: 'Dry run (build artifacts without publishing release)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file dpkg

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build Debian Package
        run: |
          ./packaging/linux/build_deb.sh "${{ steps.ver.outputs.version }}"

      - name: Build AppImage Package
        run: |
          ./packaging/linux/build_appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-linux
          path: dist/*

  build-windows:
    name: Build Windows (EXE & Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build Windows Executable and Setup
        shell: pwsh
        run: |
          packaging/windows/build_windows.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-windows
          path: dist/*

  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Build macOS Apple Silicon (arm64)
        run: |
          ./packaging/macos/build_macos.sh "${{ steps.ver.outputs.version }}" "osx-arm64"

      - name: Build macOS Intel (x64)
        run: |
          ./packaging/macos/build_macos.sh "${{ steps.ver.outputs.version }}" "osx-x64"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-macos
          path: dist/*

  release:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      APT_SIGNING_KEY_ID: ${{ secrets.APT_SIGNING_KEY_ID }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Clients from 1.2.1 refuse an unsigned manifest, so a release without the signing key must stop here,
      # before anything is uploaded. The key is the PEM of ~/.config/stalker-save-editor/update-signing-key.pem.
      - name: Check the update signing key
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY is not set: the update manifest cannot be signed (the owner sets secrets)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-signing-key.pem"
          python3 tools/release/publish_release.py --output release-output --check-signing-key \
            --signing-key "$RUNNER_TEMP/update-signing-key.pem"

      - name: Download all built packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare manifest and checksums
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          python3 tools/release/publish_release.py --artifacts release-artifacts \
            --version "$VERSION" --commit "$GITHUB_SHA" --output release-output

      - name: Sign the update manifest
        run: |
          python3 tools/release/publish_release.py --prepared --output release-output --sign \
            --signing-key "$RUNNER_TEMP/update-signing-key.pem"

      - name: Build signed APT repository
        if: env.APT_SIGNING_KEY != '' && env.APT_SIGNING_KEY_ID != ''
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          python3 tools/release/build_apt_repo.py --package release-output/stalker-save-editor_amd64.deb \
            --output release-output/apt --gpg-home "$GNUPGHOME" --signing-key "$APT_SIGNING_KEY_ID"

      - name: Publish to R2 and read back
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          python3 tools/release/publish_release.py --prepared --output release-output --publish-r2 --verify-r2 \
            --signing-key "$RUNNER_TEMP/update-signing-key.pem"

      - name: Remove the signing key file
        if: always()
        run: rm -f "$RUNNER_TEMP/update-signing-key.pem"

      - name: Report skipped publication
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::notice::R2 publication skipped - CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID are not set (the owner sets secrets)."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release-output/*.zip
            release-output/*.exe
            release-output/*.tar.gz
            release-output/*.deb
            release-output/*.dmg
            release-output/SHA256SUMS
            release-output/latest.json
            release-output/latest.json.sig
            release-artifacts/*.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
